services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-dashboard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_dashboard
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: ai-dashboard-backend
    env_file:
      - ./backend/.env.development
    ports:
      - '4000:4000'
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: ai-dashboard-frontend
    ports:
      - '5175:80'
    depends_on:
      - backend

volumes:
  postgres_data:
